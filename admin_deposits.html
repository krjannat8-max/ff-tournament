<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Manage Deposits - Bangladesh Mobile Tournament Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container { padding: 20px; }
        .request-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }
        .req-info { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; font-size: 0.85rem; margin-bottom: 15px; }
        .req-label { color: var(--text-dim); }
        .action-row { display: flex; gap: 10px; }
        .approve-btn { background: var(--accent-green); color: black; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; }
        .reject-btn { background: #ff5555; color: white; border: none; padding: 10px; border-radius: 8px; flex: 1; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="admin.html" style="color: white;"><i class="fas fa-arrow-left"></i></a>
        <div class="logo">DEPOSIT REQUESTS</div>
        <div></div>
    </header>

    <div class="admin-container">
        <div id="requests-list">
            <!-- Requests will be injected here -->
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="wallet.js"></script>
    <script>
        // Admin Check
        if (!auth.currentUser || !auth.currentUser.isAdmin) location.href = 'index.html';

        function loadRequests() {
            const list = document.getElementById('requests-list');
            
            if (useFirebase) {
                // Real-time listener for Firebase deposits
                db.collection('deposits').where('status', '==', 'pending').onSnapshot((snapshot) => {
                    const requests = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        data.docId = doc.id; // Store Firestore doc ID for actions
                        requests.push(data);
                    });
                    renderRequestsList(requests);
                }, (error) => {
                    console.error("[Firebase] Error fetching deposits:", error);
                });
                return;
            }

            const requests = JSON.parse(localStorage.getItem('ff_deposit_requests')) || [];
            const pending = requests.filter(r => r.status === 'pending');
            renderRequestsList(pending);
        }

        function renderRequestsList(requests) {
            const list = document.getElementById('requests-list');
            if (requests.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--text-dim); margin-top:50px;">No pending requests</p>`;
                return;
            }

            list.innerHTML = requests.map(req => `
                <div class="request-card" id="req-${req.docId || req.id}">
                    <div style="font-weight:bold; margin-bottom:10px;">${req.userName} (${req.userEmail})</div>
                    <div class="req-info">
                        <div><span class="req-label">Amount:</span> ৳ ${req.amount}</div>
                        <div><span class="req-label">Method:</span> ${req.method}</div>
                        <div style="grid-column: span 2;"><span class="req-label">TXID:</span> <span style="color:var(--accent-yellow);">${req.txid}</span></div>
                    </div>
                    <div class="action-row">
                        <button class="approve-btn" onclick="approveRequest(${req.id}, '${req.docId || ''}')">Approve</button>
                        <button class="reject-btn" onclick="rejectRequest(${req.id}, '${req.docId || ''}')">Reject</button>
                    </div>
                </div>
            `).join('');
        }

        async function approveRequest(id, docId) {
            if (useFirebase && docId) {
                try {
                    const reqRef = db.collection('deposits').doc(docId);
                    const reqSnap = await reqRef.get();
                    if (!reqSnap.exists) return;
                    
                    const req = reqSnap.data();
                    const amount = Number(req.amount);
                    const email = req.userEmail;

                    // Atomic Update: Balance + Request Status
                    const userRef = db.collection('users').doc(email);
                    await db.runTransaction(async (transaction) => {
                        const userDoc = await transaction.get(userRef);
                        const currentBal = userDoc.exists ? (Number(userDoc.data().balance) || 0) : 0;
                        transaction.update(userRef, { balance: currentBal + amount });
                        transaction.update(reqRef, { status: 'approved', approvedAt: firebase.firestore.FieldValue.serverTimestamp() });
                    });

                    showToast(`Online Approved: ৳ ${amount} for ${email}`, "success");
                    return;
                } catch (e) { showToast("Online Approval Failed", "error"); console.error(e); }
            }

            let requests = JSON.parse(localStorage.getItem('ff_deposit_requests')) || [];
            let users = JSON.parse(localStorage.getItem('ff_users')) || [];
            
            const reqIndex = requests.findIndex(r => r.id === id);
            if (reqIndex === -1) return;

            const req = requests[reqIndex];
            const userEmail = req.userEmail;
            const amount = Number(req.amount);

            if (isNaN(amount)) {
                showToast("Invalid amount in request", "error");
                return;
            }

            const userIndex = users.findIndex(u => u.email === userEmail);
            if (userIndex !== -1) {
                // Update balance safely
                users[userIndex].balance = (Number(users[userIndex].balance) || 0) + amount;
                
                // Update request status
                requests[reqIndex].status = 'approved';
                requests[reqIndex].approvedAt = new Date().toISOString();
                
                // Save to localStorage
                localStorage.setItem('ff_users', JSON.stringify(users));
                localStorage.setItem('ff_deposit_requests', JSON.stringify(requests));
                
                // If the approved user is the current session user, sync the balance immediately
                if (auth.currentUser && auth.currentUser.email === userEmail) {
                    auth.syncUser ? auth.syncUser() : auth.syncBalance();
                }

                showToast(`Approved ৳ ${amount} for ${userEmail}`, "success");
                loadRequests();
            } else {
                showToast("User not found!", "error");
            }
        }

        async function rejectRequest(id, docId) {
            if (useFirebase && docId) {
                await db.collection('deposits').doc(docId).update({ status: 'rejected' });
                showToast("Online Request Rejected", "info");
                return;
            }
            let requests = JSON.parse(localStorage.getItem('ff_deposit_requests')) || [];
            const req = requests.find(r => r.id === id);
            if (req) {
                req.status = 'rejected';
                localStorage.setItem('ff_deposit_requests', JSON.stringify(requests));
                showToast("Request Rejected!", "info");
                loadRequests();
            }
        }

        loadRequests();
    </script>
</body>
</html>
