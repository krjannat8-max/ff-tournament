<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Wallet - Bangladesh Mobile Tournament Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .wallet-container { padding: 20px; }
        .balance-card {
            background: linear-gradient(45deg, var(--primary-color), var(--secondary-color));
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(255, 75, 43, 0.3);
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .action-btn {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 20px;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: 0.2s;
        }
        .action-btn:active { transform: scale(0.95); background: rgba(255,255,255,0.1); }
        .action-btn i { font-size: 1.5rem; color: var(--accent-yellow); }

        .payment-methods {
            margin-top: 30px;
            background: var(--card-bg);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid var(--glass-border);
        }
        .method {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        .method:last-child { border: none; }
        .method img { width: 40px; border-radius: 5px; }

        .back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 1.2rem;
            z-index: 101;
        }
    </style>
</head>
<body class="page-transition">
    <!-- Binary Shield (Anti-Crack Protection) -->
    <div id="binary-shield">
        <div class="binary-rain" id="binary-rain"></div>
        <h1>SECURITY BREACH</h1>
        <p>
            CRACK ATTEMPT DETECTED.<br>
            ENCRYPTION LOCK ACTIVE.<br>
            SYSTEM REBOOT REQUIRED.
        </p>
        <div style="margin-top: 20px; font-size: 0.7rem; opacity: 0.6;">01000101 01010010 01010010 01001111 01010010</div>
    </div>

    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i></a>

    <div class="wallet-container">
        <h2 style="text-align: center; margin: 20px 0 30px;">My Wallet</h2>
        
        <div class="balance-card">
            <div style="font-size: 0.9rem; opacity: 0.8; margin-bottom: 10px;">Available Balance</div>
            <div id="wallet-balance" style="font-size: 2.5rem; font-weight: 800;">৳ 0.00</div>
        </div>

        <div class="action-grid">
            <a href="deposit.html" class="action-btn">
                <i class="fas fa-plus-circle"></i>
                <span>Deposit</span>
            </a>
            <a href="withdraw.html" class="action-btn">
                <i class="fas fa-paper-plane"></i>
                <span>Withdraw</span>
            </a>
        </div>

        <div class="payment-methods">
            <h4 style="margin-bottom: 15px;">Supported Methods</h4>
            <div class="method">
                <span>bKash</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR6O4N93h6XyKqg9h_oXZZ0Z5VlK8f0_X0J9A&s" alt="bKash">
            </div>
            <div class="method">
                <span>Nagad</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTeo0DId8rS3T9y6F_8i78ZfD8A8I0YjA6nAg&s" alt="Nagad">
            </div>
            <div class="method">
                <span>Rocket</span>
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT6-m-k9f_Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r-Z-r" alt="Rocket">
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <i class="fas fa-gamepad"></i>
            <span>Play</span>
        </a>
        <a href="matches.html" class="nav-item">
            <i class="fas fa-list-ul"></i>
            <span>My Matches</span>
        </a>
        <a href="results.html" class="nav-item">
            <i class="fas fa-trophy"></i>
            <span>Results</span>
        </a>
        <a href="wallet.html" class="nav-item active">
            <i class="fas fa-wallet"></i>
            <span>Wallet</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
        </a>
    </nav>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="wallet.js"></script>
    <script src="security.js"></script>
    <script>
        function mockDeposit() {
            // This is a legacy mock function, the real deposit is in deposit.html
            showToast("Please use the Deposit button to submit a real request.", "info");
        }

        function mockWithdraw() {
            showToast("Withdrawal system is coming soon!", "info");
        }
    </script>
</body>
</html>
