<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FF Tournament Pro - Access</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-main);
            position: relative;
            overflow: hidden;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            padding: 40px;
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-logo i {
            font-size: 3rem;
            color: var(--primary-color);
            filter: drop-shadow(var(--neon-glow));
        }

        .auth-logo h1 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 10px;
            font-size: 1.5rem;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: white;
            font-family: 'Space Grotesk', sans-serif;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--primary-color);
            background: rgba(255, 255, 255, 0.1);
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.2);
        }

        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            border: none;
            border-radius: 8px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .auth-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(239, 68, 68, 0.4);
        }

        .auth-links {
            text-align: center;
            margin-top: 25px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .auth-links a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
            margin: 0 10px;
        }

        .auth-links a:hover {
            text-decoration: underline;
        }

        .verify-box {
            text-align: center;
        }

        .verify-box p {
            margin-bottom: 20px;
            color: var(--text-dim);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <!-- Login Form -->
        <div class="auth-card glass" id="login-form" style="display: block;">
            <div class="auth-logo">
                <i class="fas fa-crosshairs"></i>
                <h1>LOGIN</h1>
            </div>
            <div class="form-group">
                <label>Email or Hasan Bhai ID</label>
                <input type="text" id="login-email" placeholder="email@example.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="handleLogin()">Login Now</button>
            <div class="auth-links">
                <a href="#" onclick="showForm('forgot-form')">Forgot Password?</a>
                <p style="margin-top: 15px;">Don't have an account? <a href="#" onclick="showForm('register-form')">Register</a></p>
            </div>
        </div>

        <!-- Register Form -->
        <div class="auth-card glass" id="register-form">
            <div class="auth-logo">
                <i class="fas fa-user-plus"></i>
                <h1>REGISTER</h1>
            </div>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Hasan Bhai">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="startSignupVerification()">Continue</button>
            <div class="auth-links">
                <p>Already have an account? <a href="#" onclick="showForm('login-form')">Login</a></p>
            </div>
        </div>

        <!-- Verification Form -->
        <div class="auth-card glass" id="verify-form">
            <div class="auth-logo">
                <i class="fas fa-shield-alt"></i>
                <h1>VERIFY</h1>
            </div>
            <div class="verify-box">
                <p>We've sent a 6-digit code to <br><b id="verify-email-display" style="color: var(--primary-color);"></b></p>
                <div class="form-group">
                    <input type="text" id="verify-code" placeholder="123456" maxlength="6" style="text-align: center; font-size: 1.5rem; letter-spacing: 5px;">
                </div>
                <div id="reset-pass-group" style="display: none;">
                    <div class="form-group">
                        <label>New Password</label>
                        <input type="password" id="new-password" placeholder="••••••••">
                    </div>
                </div>
                <button class="auth-btn" id="verify-action-btn" onclick="finalizeAuth()">Verify & Register</button>
                <div class="auth-links">
                    <p>Didn't get code? <a href="#" onclick="resendCode()">Resend</a></p>
                    <a href="#" onclick="showForm('login-form')" style="display: block; margin-top: 15px;">Back to Login</a>
                </div>
            </div>
        </div>

        <!-- Forgot Password Form -->
        <div class="auth-card glass" id="forgot-form">
            <div class="auth-logo">
                <i class="fas fa-key"></i>
                <h1>RECOVERY</h1>
            </div>
            <div class="form-group">
                <label>Enter your Email</label>
                <input type="email" id="forgot-email" placeholder="example@gmail.com">
            </div>
            <button class="auth-btn" onclick="startPasswordReset()">Send Reset Code</button>
            <div class="auth-links">
                <a href="#" onclick="showForm('login-form')">Back to Login</a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Global Error Handler for Mobile Debugging
        window.onerror = function(msg, url, line) {
            console.error("LOG-DEBUG-ERROR:", msg, "at line", line);
            // alert("JS ERROR: " + msg + " at " + line); // Uncomment for extreme debugging
            return false;
        };

        var currentAuthMode = 'signup'; // 'signup' or 'reset'
        var tempUserData = {};

        window.showForm = function(formId) {
            document.querySelectorAll('.auth-card').forEach(function(c) {
                c.style.display = 'none';
            });
            document.getElementById(formId).style.display = 'block';
        };

        window.handleLogin = function() {
            var emailOrId = document.getElementById('login-email').value;
            var pass = document.getElementById('login-password').value;
            
            if (!auth || !auth.login) {
                 alert("Critical: Auth system not loaded. Please refresh.");
                 return;
            }

            auth.login(emailOrId, pass).then(function(res) {
                if (res.success) {
                    location.href = 'index.html';
                } else {
                    showToast(res.message, "error");
                }
            }).catch(function(err) {
                showToast("System Error: " + err.message, "error");
            });
        };

        // Signup Flow
        window.startSignupVerification = function() {
            var name = document.getElementById('reg-name').value;
            var email = document.getElementById('reg-email').value;
            var pass = document.getElementById('reg-password').value;
            
            if (!name || !email || !pass) return showToast("Please fill all fields!", "error");
            if (email.indexOf('@') === -1) return showToast("Invalid email address!", "error");

            tempUserData = { name: name, email: email, pass: pass };
            currentAuthMode = 'signup';
            
            if (!auth || !auth.sendVerificationCode) {
                 alert("Critical: Auth system not ready.");
                 return;
            }

            auth.sendVerificationCode(email, 'signup');
            document.getElementById('verify-email-display').innerText = email;
            document.getElementById('reset-pass-group').style.display = 'none';
            document.getElementById('verify-action-btn').innerText = 'Verify & Register';
            showForm('verify-form');
        };

        // Reset Flow
        window.startPasswordReset = function() {
            var email = document.getElementById('forgot-email').value;
            if (!email) return showToast("Please enter your email!", "error");

            currentAuthMode = 'reset';
            auth.sendVerificationCode(email, 'reset');
            document.getElementById('verify-email-display').innerText = email;
            document.getElementById('reset-pass-group').style.display = 'block';
            document.getElementById('verify-action-btn').innerText = 'Reset Password';
            showForm('verify-form');
        };

        window.finalizeAuth = function() {
            var code = document.getElementById('verify-code').value;
            var email = document.getElementById('verify-email-display').innerText;

            if (code.length !== 6) return showToast("Enter 6-digit code!", "error");

            if (currentAuthMode === 'signup') {
                var check = auth.verifyCode(email, code, 'signup');
                if (check.success) {
                    auth.register(email, tempUserData.pass, tempUserData.name).then(function(reg) {
                        if (reg.success) {
                            showToast("Account Verified! Welcome.", "success");
                            setTimeout(function() { location.href = 'index.html'; }, 1500);
                            auth.login(email, tempUserData.pass);
                        } else {
                            showToast(reg.message, "error");
                        }
                    });
                } else {
                    showToast(check.message, "error");
                }
            } else {
                var newPass = document.getElementById('new-password').value;
                if (!newPass) return showToast("Enter new password!", "error");
                
                auth.resetPassword(email, code, newPass).then(function(res) {
                    if (res.success) {
                        showToast(res.message, "success");
                        showForm('login-form');
                    } else {
                        showToast(res.message, "error");
                    }
                });
            }
        };

        window.resendCode = function() {
            var email = document.getElementById('verify-email-display').innerText;
            auth.sendVerificationCode(email, currentAuthMode);
        };
    </script>
</body>
</html>
