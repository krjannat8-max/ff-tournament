<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Login - Bangladesh Mobile Tournament Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <style>
        .auth-container {
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .auth-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 30px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            backdrop-filter: blur(10px);
            display: none; /* Controlled by JS */
            animation: fadeIn 0.4s ease-out;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .auth-title {
            font-size: 1.8rem;
            font-weight: 800;
            margin-bottom: 30px;
            text-align: center;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color), var(--cyber-blue));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-size: 0.8rem; color: var(--text-dim); }
        .form-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--glass-border);
            border-radius: 10px;
            color: white;
            outline: none;
            transition: 0.3s;
        }
        .form-group input:focus { border-color: var(--cyber-blue); background: rgba(0, 242, 255, 0.05); }
        
        .auth-btn {
            width: 100%;
            background: linear-gradient(to right, var(--primary-color), var(--secondary-color));
            border: none;
            padding: 14px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .auth-btn:hover { filter: brightness(1.1); transform: translateY(-2px); }
        .auth-btn:active { transform: scale(0.98); }

        .toggle-txt { margin-top: 20px; font-size: 0.85rem; color: var(--text-dim); text-align: center; }
        .toggle-btn { color: var(--cyber-blue); cursor: pointer; font-weight: bold; }
        
        .forgot-link {
            display: block;
            text-align: right;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: -10px;
            margin-bottom: 20px;
            text-decoration: none;
        }
        
        .verify-badge {
            background: rgba(0, 242, 255, 0.1);
            color: var(--cyber-blue);
            padding: 15px;
            border-radius: 10px;
            font-size: 0.8rem;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid rgba(0, 242, 255, 0.2);
        }
        
        .code-input {
            letter-spacing: 15px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-yellow) !important;
        }
    </style>
</head>
<body>
    <div id="toast-container"></div>

    <div class="auth-container">
        <!-- LOGIN SECTION -->
        <div class="auth-card" id="login-form" style="display: block;">
            <h2 class="auth-title">LOGIN</h2>
            <div class="form-group">
                <label>Email or Admin ID</label>
                <input type="text" id="login-email" placeholder="Email or Hasan Bhai">
            </div>
            <div class="form-group" style="margin-bottom: 10px;">
                <label>Password</label>
                <input type="password" id="login-password" placeholder="••••••••">
            </div>
            <a href="#" class="forgot-link" onclick="showForm('forgot-form')">Forgot Password?</a>
            <button class="auth-btn" onclick="handleLogin()">Login Now</button>
            <p class="toggle-txt">Don't have an account? <span class="toggle-btn" onclick="showForm('register-form')">Register</span></p>
        </div>

        <!-- REGISTER SECTION -->
        <div class="auth-card" id="register-form">
            <h2 class="auth-title">REGISTER</h2>
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="reg-name" placeholder="Hasan Bhai">
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="reg-email" placeholder="example@gmail.com">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="reg-password" placeholder="••••••••">
            </div>
            <button class="auth-btn" onclick="startSignupVerification()">Continue</button>
            <p class="toggle-txt">Already have an account? <span class="toggle-btn" onclick="showForm('login-form')">Login</span></p>
        </div>

        <!-- FORGOT PASSWORD SECTION -->
        <div class="auth-card" id="forgot-form">
            <h2 class="auth-title">RECOVERY</h2>
            <p style="text-align:center; color:var(--text-dim); font-size:0.8rem; margin-bottom:20px;">Enter your email to receive a recovery code.</p>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" id="forgot-email" placeholder="example@gmail.com">
            </div>
            <button class="auth-btn" onclick="startPasswordReset()">Send Code</button>
            <p class="toggle-txt">Remembered password? <span class="toggle-btn" onclick="showForm('login-form')">Login</span></p>
        </div>

        <!-- VERIFICATION SECTION (Generic for both flows) -->
        <div class="auth-card" id="verify-form">
            <h2 class="auth-title">VERIFY</h2>
            <div class="verify-badge">
                <i class="fas fa-paper-plane"></i> A 6-digit code has been sent to <br><b id="verify-email-display">email@example.com</b>
            </div>
            <div class="form-group">
                <label>Enter 6-Digit Code</label>
                <input type="text" id="verify-code" class="code-input" maxlength="6" placeholder="000000">
            </div>
            
            <div id="reset-pass-group" style="display: none;">
                <div class="form-group">
                    <label>New Password</label>
                    <input type="password" id="new-password" placeholder="••••••••">
                </div>
            </div>

            <button class="auth-btn" id="verify-action-btn" onclick="finalizeAuth()">Verify & Complete</button>
            <p class="toggle-txt">Didn't get the code? <span class="toggle-btn" onclick="resendCode()">Resend</span></p>
        </div>
    </div>

    <script src="auth.js"></script>
    <script>
        let currentAuthMode = 'signup'; // 'signup' or 'reset'
        let tempUserData = {};

        function showForm(formId) {
            document.querySelectorAll('.auth-card').forEach(c => c.style.display = 'none');
            document.getElementById(formId).style.display = 'block';
        }

        function handleLogin() {
            const emailOrId = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;
            const res = auth.login(emailOrId, pass);
            if (res.success) {
                location.href = 'index.html';
            } else {
                showToast(res.message, "error");
            }
        }

        // Signup Flow
        function startSignupVerification() {
            const name = document.getElementById('reg-name').value;
            const email = document.getElementById('reg-email').value;
            const pass = document.getElementById('reg-password').value;
            
            if (!name || !email || !pass) return showToast("Please fill all fields!", "error");
            
            // Basic email validation
            if (!email.includes('@')) return showToast("Invalid email address!", "error");

            tempUserData = { name, email, pass };
            currentAuthMode = 'signup';
            
            auth.sendVerificationCode(email, 'signup');
            document.getElementById('verify-email-display').innerText = email;
            document.getElementById('reset-pass-group').style.display = 'none';
            document.getElementById('verify-action-btn').innerText = 'Verify & Register';
            showForm('verify-form');
        }

        // Reset Flow
        function startPasswordReset() {
            const email = document.getElementById('forgot-email').value;
            if (!email) return showToast("Please enter your email!", "error");

            currentAuthMode = 'reset';
            auth.sendVerificationCode(email, 'reset');
            document.getElementById('verify-email-display').innerText = email;
            document.getElementById('reset-pass-group').style.display = 'block';
            document.getElementById('verify-action-btn').innerText = 'Reset Password';
            showForm('verify-form');
        }

        function finalizeAuth() {
            const code = document.getElementById('verify-code').value;
            const email = document.getElementById('verify-email-display').innerText;

            if (code.length !== 6) return showToast("Enter 6-digit code!", "error");

            if (currentAuthMode === 'signup') {
                const check = auth.verifyCode(email, code, 'signup');
                if (check.success) {
                    const reg = auth.register(email, tempUserData.pass, tempUserData.name);
                    if (reg.success) {
                        showToast("Account Verified! Welcome.", "success");
                        setTimeout(() => location.href = 'index.html', 1500);
                        // Auto-login after registration
                        auth.login(email, tempUserData.pass);
                    } else {
                        showToast(reg.message, "error");
                    }
                } else {
                    showToast(check.message, "error");
                }
            } else {
                const newPass = document.getElementById('new-password').value;
                if (!newPass) return showToast("Enter new password!", "error");
                
                const res = auth.resetPassword(email, code, newPass);
                if (res.success) {
                    showToast(res.message, "success");
                    showForm('login-form');
                } else {
                    showToast(res.message, "error");
                }
            }
        }

        function resendCode() {
            const email = document.getElementById('verify-email-display').innerText;
            auth.sendVerificationCode(email, currentAuthMode);
        }
    </script>
</body>
</html>
