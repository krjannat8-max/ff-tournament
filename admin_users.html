<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Manage Users - Bangladesh Mobile Tournament Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .admin-container { padding: 20px; }
        .user-card {
            background: var(--card-bg);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .user-info { font-size: 0.85rem; }
        .login-btn {
            background: var(--cyber-blue);
            color: black;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.75rem;
        }
        .deduct-btn {
            background: #ff4b2b;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            font-size: 0.75rem;
        }
        .add-btn-sm {
            background: var(--accent-green);
            color: black;
            border: none;
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-left: 5px;
            font-size: 0.75rem;
        }
        .pass-text { color: var(--accent-yellow); font-family: monospace; }
    </style>
</head>
<body>
    <header class="app-header">
        <a href="admin.html" style="color: white;"><i class="fas fa-arrow-left"></i></a>
        <div class="logo">USER MANAGEMENT</div>
        <div></div>
    </header>

    <div class="admin-container">
        <div id="firebase-warning" style="display:none; background: #ff4b2b22; border: 1px solid #ff4b2b; color: #ff4b2b; padding: 15px; border-radius: 10px; margin-bottom: 20px; font-size: 0.85rem; text-align: center;">
            <i class="fas fa-exclamation-triangle"></i> <strong>Offline Mode:</strong> Firebase is not configured. Users from other devices will NOT appear here. 
            <br><small>Please update <code>firebase-config.js</code> to enable global sync.</small>
        </div>
        <div id="users-list">
            <!-- Users will be injected here -->
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script>
        // Admin Check
        if (!auth.currentUser || !auth.currentUser.isAdmin) location.href = 'index.html';

        function loadUsers() {
            const list = document.getElementById('users-list');
            const warning = document.getElementById('firebase-warning');
            
            if (useFirebase) {
                if(warning) warning.style.display = 'none';
                // Real-time listener for Firebase
                db.collection('users').onSnapshot((snapshot) => {
                    const users = [];
                    snapshot.forEach(doc => users.push(doc.data()));
                    renderUsersList(users);
                }, (error) => {
                    console.error("[Firebase] Error fetching users:", error);
                    showToast("Failed to fetch online users", "error");
                });
                return;
            }

            if(warning) warning.style.display = 'block';
            const users = JSON.parse(localStorage.getItem('ff_users')) || [];
            renderUsersList(users);
        }

        async function renderUsersList(users) {
            const list = document.getElementById('users-list');
            if (users.length === 0) {
                list.innerHTML = `<p style="text-align:center; color:var(--text-dim); margin-top:50px;">No registered users</p>`;
                return;
            }

            // Fetch global bans if using firebase
            let bannedDevices = [];
            if (useFirebase) {
                const bansDoc = await db.collection('settings').doc('bans').get();
                if (bansDoc.exists) bannedDevices = bansDoc.data().devices || [];
            } else {
                bannedDevices = JSON.parse(localStorage.getItem('ff_banned_devices')) || [];
            }

            list.innerHTML = users.map(user => {
                const bannedDevices = JSON.parse(localStorage.getItem('ff_banned_devices')) || [];
                const isDeviceBanned = user.lastDeviceId && bannedDevices.includes(user.lastDeviceId);
                
                return `
                    <div class="user-card" style="${user.isBanned ? 'border-color: #ff4b2b; background: rgba(255, 75, 43, 0.05);' : ''}">
                        <div class="user-info">
                            <div style="display:flex; align-items:center; gap:10px; margin-bottom:5px;">
                                <div style="font-weight:bold; font-size:1rem;">${user.name}</div>
                                ${user.isBanned ? '<span style="background:#ff4b2b; color:white; font-size:0.6rem; padding:2px 6px; border-radius:4px;">BANNED</span>' : ''}
                                ${isDeviceBanned ? '<span style="background:#cc0000; color:white; font-size:0.6rem; padding:2px 6px; border-radius:4px;">DEVICE BANNED</span>' : ''}
                            </div>
                            <div>Email: <span style="color:white;">${user.email}</span></div>
                            <div>Password: <span class="pass-text">${user.password}</span></div>
                            <div>Balance: <span style="color:var(--accent-green);">৳ ${Number(user.balance || 0).toFixed(2)}</span></div>
                            <div style="font-size:0.7rem; color:var(--text-dim); margin-top:5px;">Last Device: ${user.lastDeviceId || 'Unknown'}</div>
                        </div>
                        <div style="display:flex; flex-direction:column; gap:5px;">
                            <button class="login-btn" onclick="loginAsUser('${user.email}')">Login</button>
                            <div style="display:flex; gap:5px;">
                                <button class="add-btn-sm" onclick="adjustBalance('${user.email}', 'add')" title="Add Balance"><i class="fas fa-plus"></i></button>
                                <button class="deduct-btn" onclick="adjustBalance('${user.email}', 'deduct')" title="Deduct Balance"><i class="fas fa-minus"></i></button>
                            </div>
                            <button class="deduct-btn" style="background:#666;" onclick="handleToggleBan('${user.email}')">
                                <i class="fas fa-user-slash"></i> ${user.isBanned ? 'Unban' : 'Ban User'}
                            </button>
                            <button class="deduct-btn" style="background:#000;" onclick="handleToggleDeviceBan('${user.email}')">
                                <i class="fas fa-laptop-code"></i> ${isDeviceBanned ? 'Unban Dev' : 'Ban Device'}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        async function handleToggleBan(email) {
            if (useFirebase) {
                try {
                    const userRef = db.collection('users').doc(email);
                    const doc = await userRef.get();
                    if (doc.exists) {
                        const newStatus = !doc.data().isBanned;
                        await userRef.update({ isBanned: newStatus });
                        showToast(newStatus ? "User Banned!" : "User Unbanned!", "success");
                    }
                    return;
                } catch (e) { showToast("Global ban failed", "error"); }
            }
            const res = auth.toggleUserBan(email);
            if (res.success) {
                showToast(res.banned ? "User Banned Successfully!" : "User Unbanned!", "success");
                loadUsers();
            }
        }

        async function handleToggleDeviceBan(email) {
            if (useFirebase) {
                try {
                    const userDoc = await db.collection('users').doc(email).get();
                    const devId = userDoc.data().lastDeviceId;
                    if (!devId) return showToast("No device ID found", "error");

                    const bansRef = db.collection('settings').doc('bans');
                    const bansDoc = await bansRef.get();
                    let devices = bansDoc.exists ? bansDoc.data().devices || [] : [];
                    
                    let isBanned = false;
                    if (devices.includes(devId)) {
                        devices = devices.filter(id => id !== devId);
                        isBanned = false;
                    } else {
                        devices.push(devId);
                        isBanned = true;
                    }
                    await bansRef.set({ devices }, { merge: true });
                    showToast(isBanned ? "Device Banned!" : "Device Unbanned!", "success");
                    return;
                } catch (e) { showToast("Device ban failed", "error"); }
            }
            const res = auth.toggleDeviceBan(email);
            if (res.success) {
                showToast(res.banned ? "Device Banned Successfully!" : "Device Unbanned!", "success");
                loadUsers();
            } else {
                showToast(res.message || "Failed to toggle device ban", "error");
            }
        }

        async function adjustBalance(email, type) {
            const amountStr = prompt(`Enter amount to ${type === 'add' ? 'add to' : 'deduct from'} balance:`);
            const amount = parseFloat(amountStr);
            
            if (isNaN(amount) || amount <= 0) return;

            if (useFirebase) {
                try {
                    const userRef = db.collection('users').doc(email);
                    const doc = await userRef.get();
                    if (doc.exists) {
                        let bal = Number(doc.data().balance) || 0;
                        let finalBal = (type === 'add') ? bal + amount : Math.max(0, bal - amount);
                        await userRef.update({ balance: finalBal });
                        showToast("Online Balance Updated!", "success");
                    }
                    return;
                } catch (e) { showToast("Online update failed", "error"); }
            }

            let users = JSON.parse(localStorage.getItem('ff_users')) || [];
            const userIndex = users.findIndex(u => u.email === email);
            
            if (userIndex !== -1) {
                const currentBal = Number(users[userIndex].balance || 0);
                
                const proceedWithAdjustment = (finalAmount) => {
                    if (type === 'add') {
                        users[userIndex].balance = currentBal + finalAmount;
                    } else {
                        users[userIndex].balance = Math.max(0, currentBal - finalAmount);
                    }

                    localStorage.setItem('ff_users', JSON.stringify(users));
                    
                    if (auth.currentUser && auth.currentUser.email === email) {
                        auth.syncUser ? auth.syncUser() : auth.syncBalance();
                    }

                    showToast(`Balance ${type === 'add' ? 'Added' : 'Deducted'} Successfully!`, "success");
                    loadUsers();
                };

                if (type === 'deduct' && currentBal < amount) {
                    showCustomConfirm(`User only has ৳ ${currentBal}. Deduct full amount anyway?`, "OVERCHARGE WARNING", () => {
                        proceedWithAdjustment(currentBal);
                    });
                } else {
                    proceedWithAdjustment(amount);
                }
            }
        }

        function loginAsUser(email) {
            const users = JSON.parse(localStorage.getItem('ff_users')) || [];
            const user = users.find(u => u.email === email);
            if (user) {
                auth.currentUser = user;
                localStorage.setItem('ff_user', JSON.stringify(user));
                showToast(`Logged in as ${user.name}`, "success");
                setTimeout(() => location.href = 'index.html', 1000);
            }
        }

        loadUsers();
    </script>
</body>
</html>
