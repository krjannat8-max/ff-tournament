<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
    <title>Transaction History - Bangladesh Mobile Tournament Official</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .history-container { padding: 20px; padding-bottom: 100px; }
        .details-card {
            background: var(--card-bg);
            border-radius: 20px;
            border: 1px solid var(--glass-border);
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
        }
        .details-card::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 20px;
            border: 1px solid transparent;
            background: linear-gradient(135deg, rgba(255,255,255,0.05), transparent) border-box;
            -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: destination-out;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="toast-container" style="position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px;"></div>

    <header class="app-header">
        <a href="profile.html" style="color: white;"><i class="fas fa-arrow-left"></i></a>
        <div class="logo">WITHDRAW HISTORY</div>
        <div onclick="initHistoryListener()" style="cursor:pointer; color:var(--cyber-blue); font-size:1.1rem; padding: 5px;"><i class="fas fa-sync-alt"></i></div>
    </header>

    <div class="history-container">
        <div id="history-list">
            <div style="text-align: center; padding: 50px; color: var(--text-dim);">
                <i class="fas fa-spinner fa-spin" style="font-size: 2rem; margin-bottom: 10px;"></i>
                <p>Loading your history...</p>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="auth.js"></script>
    <script src="wallet.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Wait for auth to be ready
            let attempts = 0;
            const checkAuth = setInterval(() => {
                attempts++;
                if (typeof auth !== 'undefined' && auth.currentUser) {
                    clearInterval(checkAuth);
                    initHistoryListener();
                } else if (attempts > 50) { // 5 seconds timeout
                    clearInterval(checkAuth);
                    document.getElementById('history-list').innerHTML = `
                        <div class="details-card" style="text-align:center; padding: 50px;">
                            <p style="color:var(--text-dim);">Please log in to view your history.</p>
                            <a href="login.html" style="display:inline-block; margin-top:15px; color:var(--cyber-blue);">Login Now</a>
                        </div>`;
                }
            }, 100);
        });

        function initHistoryListener() {
            const list = document.getElementById('history-list');
            const localRequests = JSON.parse(localStorage.getItem('ff_withdrawals')) || [];
            const userEmail = auth.currentUser.email.toLowerCase().trim();
            
            if (typeof useFirebase !== 'undefined' && useFirebase) {
                console.log("[History] Syncing from Firebase for:", userEmail);
                
                try {
                    db.collection('withdrawals')
                        .where('userEmail', '==', userEmail)
                        .onSnapshot(function(snapshot) {
                            var fireRequests = [];
                            snapshot.forEach(function(doc) {
                                var data = doc.data();
                                data.id = doc.id;
                                if (data.timestamp) {
                                    if (typeof data.timestamp.toMillis === 'function') {
                                        data.timestamp = data.timestamp.toMillis();
                                    } else if (data.timestamp.seconds) {
                                        data.timestamp = data.timestamp.seconds * 1000;
                                    }
                                }
                                fireRequests.push(data);
                            });
                            
                            // Merge with local requests, prioritizing Firebase (by ID)
                            const merged = [...fireRequests];
                            localRequests.forEach(lr => {
                                if (!merged.find(fr => fr.id === lr.id)) {
                                    merged.push(lr);
                                }
                            });

                            merged.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                            localStorage.setItem('ff_withdrawals', JSON.stringify(merged));
                            renderHistoryUI(merged);
                        }, function(error) {
                            console.error("[Firebase] History query failed:", error);
                            loadLocalHistory();
                        });
                } catch (e) {
                    console.error("[History] Fatal error in listener:", e);
                    loadLocalHistory();
                }
            } else {
                loadLocalHistory();
            }
        }

        function loadLocalHistory() {
            const allRequests = JSON.parse(localStorage.getItem('ff_withdrawals')) || [];
            let myRequests = allRequests.filter(r => r.userEmail === auth.currentUser.email);
            myRequests.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
            renderHistoryUI(myRequests);
        }

        function renderHistoryUI(myRequests) {
            const list = document.getElementById('history-list');

            if (myRequests.length === 0) {
                list.innerHTML = `
                    <div class="details-card" style="text-align:center; padding: 50px;">
                        <div style="color:var(--text-dim); opacity: 0.5;">
                            <i class="fas fa-history" style="font-size: 3rem; margin-bottom: 20px;"></i>
                            <p style="font-size: 1.1rem; font-weight: 600;">No history found</p>
                            <p style="font-size: 0.85rem; margin-top: 5px;">You haven't made any withdrawal requests yet.</p>
                        </div>
                        <a href="wallet.html" style="display: inline-block; margin-top: 25px; padding: 12px 25px; background: var(--cyber-blue); color: black; border-radius: 10px; text-decoration: none; font-weight: 800; font-size: 0.9rem;">Go to Wallet</a>
                    </div>`;
                return;
            }

            list.innerHTML = myRequests.map(req => {
                let statusColor = "var(--accent-yellow)";
                let statusText = "Pending";
                let statusIcon = "fa-clock";
                let statusBg = "rgba(255, 184, 0, 0.1)";

                if (req.status === 'approved' || req.status === 'completed') {
                    statusColor = "var(--accent-green)";
                    statusText = "Completed";
                    statusIcon = "fa-check-circle";
                    statusBg = "rgba(0, 184, 148, 0.1)";
                } else if (req.status === 'rejected') {
                    statusColor = "#ff4b2b";
                    statusText = "Rejected";
                    statusIcon = "fa-times-circle";
                    statusBg = "rgba(255, 75, 43, 0.1)";
                }

                const dateObj = new Date(req.timestamp || Date.now());
                const dateStr = dateObj.toLocaleDateString('en-GB', { 
                    day: 'numeric', 
                    month: 'short', 
                    year: 'numeric' 
                }) + ' at ' + dateObj.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                return `
                <div class="details-card" style="padding: 15px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                        <div>
                            <div style="font-size: 0.75rem; color: var(--text-dim); margin-bottom: 2px;">Requested Amount</div>
                            <div style="font-size: 1.4rem; font-weight: 800; color: white;">৳ ${(Number(req.amount) || 0).toFixed(2)}</div>
                        </div>
                        <div style="text-align: right;">
                            <div style="color: ${statusColor}; font-weight: 800; font-size: 0.8rem; padding: 6px 12px; background: ${statusBg}; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px;">
                                <i class="fas ${statusIcon}"></i>
                                ${(statusText || "PENDING").toUpperCase()}
                            </div>
                        </div>
                    </div>
                    
                    <div style="background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05);">
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--text-dim); font-size: 0.8rem;">Method</span>
                            <span style="font-weight: 700; font-size: 0.85rem; color: white;">${req.method}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
                            <span style="color: var(--text-dim); font-size: 0.8rem;">To Account</span>
                            <span style="font-weight: 700; font-size: 0.85rem; color: var(--accent-yellow); letter-spacing: 0.5px;">${req.account}</span>
                        </div>
                        <div style="display: flex; justify-content: space-between;">
                            <span style="color: var(--text-dim); font-size: 0.8rem;">Requested On</span>
                            <span style="font-weight: 600; font-size: 0.8rem; color: var(--text-dim);">${dateStr}</span>
                        </div>
                    </div>
                </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>
