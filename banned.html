<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Denied - FF Tournament Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: #05070a;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .ban-card {
            background: rgba(255, 75, 43, 0.05);
            border: 1px solid rgba(255, 75, 43, 0.2);
            padding: 40px 30px;
            border-radius: 20px;
            max-width: 400px;
            backdrop-filter: blur(10px);
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .ban-icon {
            font-size: 4rem;
            color: #ff4b2b;
            margin-bottom: 20px;
            text-shadow: 0 0 20px rgba(255, 75, 43, 0.4);
        }
        h1 {
            color: white;
            font-size: 1.8rem;
            margin-bottom: 15px;
            font-weight: 800;
        }
        p {
            color: var(--text-dim);
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .support-btn {
            display: inline-block;
            background: #ff4b2b;
            color: white;
            text-decoration: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.3s;
        }
        .support-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.3);
        }
    </style>
</head>
<body>
    <div class="ban-card">
        <div class="ban-icon">
            <i class="fas fa-user-slash"></i>
        </div>
        <h1 id="ban-title">ACCESS DENIED</h1>
        <p id="ban-msg">Your account or device has been suspended for violating our terms of service. If you believe this is a mistake, please contact our support team.</p>
        <a href="mailto:support@pro.ff" class="support-btn">Contact Support</a>
        <div style="margin-top: 20px;">
            <a href="login.html" style="color: var(--cyber-blue); font-size: 0.8rem; text-decoration: none;">Try Switching Account</a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const type = urlParams.get('type');
        
        if (type === 'account') {
            document.getElementById('ban-title').innerText = "ACCOUNT BANNED";
            document.getElementById('ban-msg').innerText = "This specific account has been permanently suspended by the administrator.";
        }
    </script>
</body>
</html>
